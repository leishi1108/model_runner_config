# 202608市政数据
[dataset_municipal_list_202608]
class = ReadExcelDataset
dir = /home/shilei/corpus/cost_split/市政清单-2026-08
header_row = 0

[dataset_municipal_list_202608_valid]
class = FilterDataset
input = municipal_list_202608
filters = x["完成"] in ["1", 1]


[dataset_municipal_list_202608_label]
class = MapDataset
input = municipal_list_202608_valid
expression = exec('import re; import uuid') or {
    "item_name": x["item_name"] if x["item_name"] is not None else "",
    "item_feature": x["item_feature"] if x["item_feature"] is not None else "",
    "upper_item_name": x["upper_item_name"] if x["upper_item_name"] is not None else "",
    "unit": x["unit"] if x["unit"] is not None else "",

    "pid_code": uuid.uuid3(uuid.NAMESPACE_DNS, x["pid"]).hex,

    "item_name_wk": f'清单名称: {x["item_name"]}' if x["item_name"] is not None else "",
    "item_feature_wk": f'清单特征: {x["item_feature"]}' if x["item_feature"] is not None else "",
    "upper_item_name_wk": f'全路径: {x["upper_item_name"]}' if x["upper_item_name"] is not None else "",
    "unit_wk": f'单位: {x["unit"]}' if x["unit"] is not None else "",

    "element_label": [] if x["构件预期"] == "无构件" else list(sorted(x["构件预期"].split(","))) if x["构件预期"] is not None and len(x["构件预期"])>0 else [],
    "material_label": [] if x["材料预期"] == "无材料" else list(sorted(x["材料预期"].split(","))) if x["材料预期"] is not None and len(x["材料预期"])>0 else [],
    "locElement_label": [] if x["部位构件预期"] == "无部位构件" else list(sorted(x["部位构件预期"].split(","))) if x["部位构件预期"] is not None and len(x["部位构件预期"])>0 else [],
    }
keep_exists = True




# 预标注数据
[dataset_municipal_list_predata]
class = ReadExcelDataset
dir = /home/shilei/corpus/cost_split/市政清单-预标注数据.xlsx
header_row = 0


[dataset_municipal_list_predata_label]
class = MapDataset
input = municipal_list_predata
expression = exec('import re; import uuid') or {"item_id": uuid.uuid3(uuid.NAMESPACE_DNS, str(x["uid"]) + "-" + str(x["sn"])).hex,
    "list_key": str(x["uid"]) + "-" + str(x["sn"]),

    "item_name": x["清单名称"] if x["清单名称"] is not None else "",
    "item_feature": x["项目特征633-1632"] if x["项目特征633-1632"] is not None else "",
    "upper_item_name": x["分部分项全路径"] if x["分部分项全路径"] is not None else "",
    "unit": x["单位"] if x["单位"] is not None else "",

    "pid": "市政清单-预标注数据",
    "pid_code": uuid.uuid3(uuid.NAMESPACE_DNS, "市政清单-预标注数据").hex,

    "item_name_wk": f'清单名称: {x["清单名称"]}' if x["清单名称"] is not None else "",
    "item_feature_wk": f'清单特征: {x["项目特征633-1632"]}' if x["项目特征633-1632"] is not None else "",
    "upper_item_name_wk": f'全路径: {x["分部分项全路径"]}' if x["分部分项全路径"] is not None else "",
    "unit_wk": f'单位: {x["单位"]}' if x["单位"] is not None else "",

    "element_label": [] if x["构件预期"] == "无构件" else list(sorted(x["构件预期"].split(","))) if x["构件预期"] is not None and len(x["构件预期"])>0 else [],
    "material_label": [] if x["材料预期"] == "无材料" else list(sorted(x["材料预期"].split(","))) if x["材料预期"] is not None and len(x["材料预期"])>0 else [],
    "locElement_label": []
    }
keep_exists = True

[dataset_municipal_list_merge]
class = MergeDataset
datasets = municipal_list_predata_label, municipal_list_202608_label



[dataset_municipal_list_train]
class = FilterDataset
input = municipal_list_merge
filters = int(x["item_id"][-5:],16) % 10 >= 1

[dataset_municipal_list_test]
class = FilterDataset
input = municipal_list_merge
filters = int(x["item_id"][-5:],16) % 10 < 1


[model_municipal_list_model]
class = MultiHeadClassificationModelV2
data = municipal_list_train
bert_base = /home/shilei/fbpmx/list_standard/list_standard_20260703/model_list_ml_model/model
; bert_base = /home/shilei/model_repository/chinese-roberta-wwm-ext_ft
text_key = item_name_wk
extra_feats = unit_wk, upper_item_name_wk, item_feature_wk
