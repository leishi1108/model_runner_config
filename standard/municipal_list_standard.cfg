[DEFAULT]
workspace = /home/shilei/fbpmx/list_standard/municipal_list_standard_${date}

[project]
actions = generate, run
datasets = municipal_list
stages = municipal_list_label_export

[dataset_raw_municipal_list]
class = ReadFileDataset
format = json
dir = /home/shilei/corpus/cost_split/municipal_list_data.json

[dataset_raw_municipal_list_grouped]
class = GroupedDataset
input = raw_municipal_list
groupby = project_id
value_key = bq_item_content
delimiter = :::


[dataset_municipal_list]
class = MapDataset
input = raw_municipal_list
expression = exec('import re; import uuid') or {"item_id": uuid.uuid3(uuid.NAMESPACE_DNS, str(x["bq_item_key"])).hex,
    "list_key": str(x["bq_item_key"]),
    "list_code": str(x["bq_item_code"]),

    "item_name": x["bq_item_content"] if x["bq_item_content"] is not None else "",
    "item_feature": x["bq_item_spec"] if x["bq_item_spec"] is not None else "",
    "upper_item_name": x["bq_item_title_with_upper"] if x["bq_item_title_with_upper"] is not None else "",
    "unit": x["bq_item_unit"] if x["bq_item_unit"] is not None else "",

    "pid": str(x["project_id"]),
    "pid_code": uuid.uuid3(uuid.NAMESPACE_DNS, str(x["project_id"])).hex,

    "item_name_wk": f'清单名称: {x["bq_item_content"]}' if x["bq_item_content"] is not None else "",
    "item_feature_wk": f'清单特征: {x["bq_item_spec"]}' if x["bq_item_spec"] is not None else "",
    "upper_item_name_wk": f'全路径: {x["bq_item_title_with_upper"]}' if x["bq_item_title_with_upper"] is not None else "",
    "unit_wk": f'单位: {x["bq_item_unit"]}' if x["bq_item_unit"] is not None else "",
    }
keep_exists = True

