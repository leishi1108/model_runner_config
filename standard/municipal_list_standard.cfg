    "item_replace_id": uuid.uuid3(uuid.NAMESPACE_DNS, re.sub(r'[0-9]+', '数', x["bq_item_content"]) if x["bq_item_content"] is not None else "" + re.sub(r'[0-9]+', '数', x["bq_item_spec"]) if x["bq_item_spec"] is not None else "" + re.sub(r'[0-9]+', '数', x["bq_item_title_with_upper"]) if x["bq_item_title_with_upper"] is not None else "").hex,
    "item_name_replace": re.sub(r'[0-9]+', '数', x["bq_item_content"]) if x["bq_item_content"] is not None else "",
    "item_feature_replace": re.sub(r'[0-9]+', '数', x["bq_item_spec"]) if x["bq_item_spec"] is not None else "",
