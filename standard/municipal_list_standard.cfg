    "unit": x["bq_item_unit"] if x["bq_item_unit"] is not None else "",

    "pid": str(x["project_id"]),
    "pid_code": uuid.uuid3(uuid.NAMESPACE_DNS, str(x["project_id"])).hex,

    "item_name_wk": f'清单名称: {x["bq_item_content"]}' if x["bq_item_content"] is not None else "",
