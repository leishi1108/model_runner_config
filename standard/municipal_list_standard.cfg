[DEFAULT]
workspace = /home/shilei/fbpmx/list_standard/municipal_list_standard_${date}

[project]
actions = generate, evaluate
datasets = municipal_list_predata_label, municipal_list, municipal_pricelib_choose_for_label
evaluators = municipal_list_element_model_evaluate, municipal_list_material_model_evaluate
; evaluators = municipal_list_element_model_evaluate, municipal_list_material_model_evaluate, municipal_list_element_ml_model_evaluate, municipal_list_material_ml_model_evaluate, municipal_list_ml_model_predict, municipal_pricelib_predict, yajun_municipal_pricelib_predict
