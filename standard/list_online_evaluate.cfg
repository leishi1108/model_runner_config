[DEFAULT]
workspace = /home/shilei/fbpmx/list_standard/list_online_evaluate_${date}

[project]
actions = generate, run
datasets = aecloud_list_pricelib_relation_dec, aecloud_list_cost_relation_incorrect, list_cost_relation_incorrect_dedup
; datasets = aecloud_list_cost_relation_dec, aecloud_list_quantity_relation_dec, aecloud_list_pricelib_relation_dec
; evaluate = aecloud_list_quantity_relation_dec_predict
; evaluators = aecloud_list_cost_relation_dec_predict, aecloud_list_pricelib_relation_dec_predict, aecloud_list_quantity_relation_dec_predict
; stages = aecloud_list_cost_relation_dec_export, aecloud_list_pricelib_relation_dec_export, aecloud_list_quantity_relation_dec_export
stages = aecloud_list_cost_relation_incorrect_export



[dataset_aecloud_list_cost_relation]
class = GlodonAECloudRelationDataset
url = https://xmgl.glodon.com/gde/api/cdeconsole    # 生产环境
data_type = 闭环
access_token = cn-21af9432-b285-43e0-a963-0a897b55ec0c-ut
; (apiId="16630004", catalogId="860001", relationId="519999180013")
apiId = 16630004   # 成本测算-收入拆分-连接关系：清单定额-成本科目
catalogId = 860001 # 2026-08
relationId = 519999180013   # 清单与成本科目关系

[dataset_aecloud_list_cost_relation_incorrect]
class = FilterDataset
input = aecloud_list_cost_relation
filters = ("main&element" in x) and ("市政专业" not in x["main&element"]) and ("安装专业" not in x["main&element"]) and (x["main&uid"] == x["main&GDE_BudgetBillid"]) and ("cdeVerifyResultStatus" in x) and (x["cdeVerifyResultStatus"] in ["2", "3", "4", "5", "6"])


[dataset_aecloud_list_cost_relation_incorrect_trans]
class = MapDataset
input = aecloud_list_cost_relation_incorrect
expression = exec('import re; import uuid') or {"item_id": uuid.uuid3(uuid.NAMESPACE_DNS, str(x["project_name"]) + "-" + str(x["main&uid"])).hex,

    "list_key": str(x["project_name"]) + "-" + str(x["main&uid"]),
    "list_code": str(x["main&code"]),


    "item_name": x["main&description"] if x["main&description"] is not None else "",
    "item_feature": x["main&spec"] if x["main&spec"] is not None else "",
    "upper_item_name": x["main&full_name"] if x["main&full_name"] is not None else "",
    "unit": x["main&unit"] if x["main&unit"] is not None else "",
    "project_node_name": x["main&project_node_name"] if x["main&project_node_name"] is not None else "",

    "pid": str(x["project_name"]),
    "pid_code": uuid.uuid3(uuid.NAMESPACE_DNS, str(x["project_name"])).hex,

    "item_name_replace": re.sub(r'[0-9]+', '数', x["main&description"]) if x["main&description"] is not None else "",
    "item_feature_replace": re.sub(r'[0-9]+', '数', x["main&spec"]) if x["main&spec"] is not None else "",
    "upper_item_name_replace": re.sub(r'[0-9]+', '数', x["main&full_name"]) if x["main&full_name"] is not None else "",

    "清单解析": x["main&element"],

    "线上上级": x["target&full_name"] if "target&full_name" in x and x["target&full_name"] is not None else "",
    "线上名称": x["target&caption"] if "target&caption" in x and x["target&caption"] is not None else "",
    "线上解析": x["target&element"] if "target&element" in x and x["target&element"] is not None else "",

    "预期上级": x["result&full_name"] if "result&full_name" in x and x["result&full_name"] is not None else "",
    "预期名称": x["result&caption"] if "result&caption" in x and x["result&caption"] is not None else "",
    "预期解析": x["result&element"] if "result&element" in x and x["result&element"] is not None else "",
    }
keep_exists = True


[dataset_list_cost_relation_incorrect_dedup]
class = AccumulateDataset
input = aecloud_list_cost_relation_incorrect_trans
deduplicate_by = item_name, item_feature, upper_item_name, unit


[stage_aecloud_list_cost_relation_incorrect_export]
class = DatasetExportStage
dataset = aecloud_list_cost_relation_incorrect_trans
output_fields = item_id, pid, list_key, list_code, upper_item_name, item_name, item_feature, unit, 清单解析, 线上上级, 线上名称, 线上解析, 预期上级, 预期名称, 预期解析
output_names = item_id, pid, list_key, list_code, upper_item_name, item_name, item_feature, unit, 清单解析, 线上上级, 线上名称, 线上解析, 预期上级, 预期名称, 预期解析
save_res_path = /home/shilei/fbpmx/list_standard/list_online_evaluate_${date}/aecloud_list_cost_relation_incorrect_export_${date}.xlsx



